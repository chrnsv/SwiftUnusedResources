[tasks.build]
description = "Build release binary"
run = "SKIP_SWIFTLINT=1 swift build -c release --arch arm64 --product sur"

[tasks.linux-build]
description = "Build the Linux binary in a container (Apple `container` CLI)"
run = '''
#!/usr/bin/env bash
set -e

# swift-syntax needs real memory: the 1 GB default makes the VM swap for minutes.
container run --rm \
  --cpus 8 --memory 8g \
  --volume "$PWD:/workspace" --workdir /workspace \
  --env SKIP_SWIFTLINT=1 \
  swift:6.3-jammy \
  swift build -c release --static-swift-stdlib --product sur --scratch-path .build-linux
'''

[tasks.linux-test]
description = "Run the test suite on Linux in a container (Apple `container` CLI)"
run = '''
#!/usr/bin/env bash
set -e

container run --rm \
  --cpus 8 --memory 8g \
  --volume "$PWD:/workspace" --workdir /workspace \
  --env SKIP_SWIFTLINT=1 \
  swift:6.3-jammy \
  bash -c 'swift build --build-tests --scratch-path .build-linux && swift test --skip-build --scratch-path .build-linux'
'''

[tasks.set-version]
description = "Write <version> into the version constant in SUR.swift"
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION=${1:?Usage: mise run set-version <version>}

# GNU and BSD sed disagree about -i, so edit through a temp file instead.
edit() {
  sed -E "$2" "$1" > "$1.tmp"
  mv "$1.tmp" "$1"
}

# Only the version constant: the binaryTarget in Package.swift keeps pointing at
# the previous release until `publish` rewrites it. Repointing it here would make
# `swift build` fail, because SwiftPM downloads binary artifacts while resolving
# and the new release does not exist yet.
edit Sources/SUR/SUR.swift "s/(static let version = \")[^\"]+(\")/\1$VERSION\2/"

echo "Version set to $VERSION"
'''

[tasks.stage-binary]
description = "Build the release binary for the host platform and stage it under .release/"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The slot name doubles as the artifact-bundle directory and picks the triple.
case "$(uname -s)" in
  # macOS ships the Swift runtime, so the binary can link against it.
  Darwin) SLOT="macos-arm64"; BUILD_ARGS=(--arch arm64) ;;
  # Linux does not: without --static-swift-stdlib the binary needs libswiftCore.so
  # and friends at run time, which defeats shipping it to toolchain-less machines.
  Linux)  SLOT="linux-$(uname -m)"; BUILD_ARGS=(--static-swift-stdlib) ;;
  *) echo "Unsupported host: $(uname -s)" >&2; exit 1 ;;
esac

export SKIP_SWIFTLINT=1
swift build -c release "${BUILD_ARGS[@]}" --product sur

BIN="$(swift build -c release "${BUILD_ARGS[@]}" --show-bin-path)/sur"
mkdir -p ".release/$SLOT"
cp "$BIN" ".release/$SLOT/sur"

# BSD strip and GNU strip take different flags.
if [ "$(uname -s)" = "Darwin" ]; then
  strip -rSTx ".release/$SLOT/sur"
else
  strip ".release/$SLOT/sur"
fi

echo "Staged .release/$SLOT/sur"
'''

[tasks.artifactbundle]
description = "Assemble the macOS artifact bundle from .release/macos-arm64"
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION=${1:?Usage: mise run artifactbundle <version>}

# macOS only: the bundle exists for the SwiftPM binaryTarget behind
# SURBuildToolPlugin, and that plugin only ever runs from Xcode. Linux binaries
# ship as separate release archives instead of inflating every plugin download.
SRC=".release/macos-arm64/sur"
[ -f "$SRC" ] || { echo "Missing $SRC — run 'mise run stage-binary' on macOS first." >&2; exit 1; }

BUNDLE="sur-$VERSION.artifactbundle"
rm -rf "$BUNDLE" "$BUNDLE.zip"

mkdir -p "$BUNDLE/bin"
cp "$SRC" "$BUNDLE/bin/sur"
chmod +x "$BUNDLE/bin/sur"

cat > "$BUNDLE/info.json" <<EOF
{
    "schemaVersion": "1.0",
    "artifacts": {
        "sur": {
            "version": "$VERSION",
            "type": "executable",
            "variants": [
                {
                    "path": "bin/sur",
                    "supportedTriples": ["arm64-apple-macosx"]
                }
            ]
        }
    }
}
EOF

(cd "$BUNDLE" && zip -q -r "../$BUNDLE.zip" .)
rm -rf "$BUNDLE"

echo "Created $BUNDLE.zip"
'''

[tasks.archives]
description = "Package every staged binary as a standalone release archive"
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION=${1:?Usage: mise run archives <version>}

shopt -s nullglob
dirs=(.release/*/)
# Testing the first element rather than the array length: mise renders task
# scripts as templates, and a dollar-brace-hash sequence opens a comment tag.
[ -n "${dirs[0]:-}" ] || { echo "Nothing staged in .release/ — run 'mise run stage-binary' first." >&2; exit 1; }

for dir in "${dirs[@]}"; do
  SLOT=$(basename "$dir")
  [ -f "$dir/sur" ] || { echo "Missing $dir/sur" >&2; exit 1; }

  # `bin/sur` inside the archive means mise puts the same `bin` directory on
  # PATH on every platform.
  STAGE=$(mktemp -d)
  mkdir -p "$STAGE/bin"
  cp "$dir/sur" "$STAGE/bin/sur"
  chmod +x "$STAGE/bin/sur"

  # The slot name carries the os and arch tokens mise scores assets on. The
  # artifact bundle is not a substitute: its name has no tokens, so mise
  # rejects it with "No matching asset found" on every platform.
  ARCHIVE="sur-$VERSION-$SLOT.tar.gz"
  rm -f "$ARCHIVE"
  # COPYFILE_DISABLE keeps BSD tar from adding ._* AppleDouble entries when the
  # archive happens to be built on macOS; GNU tar ignores the variable.
  COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C "$STAGE" bin
  rm -rf "$STAGE"

  echo "Created $ARCHIVE"
done
'''

[tasks.publish]
description = "Commit the release checksum, tag it and upload every release asset (runs on CI)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION=${1:?Usage: mise run publish <version>}
BUNDLE_ZIP="sur-$VERSION.artifactbundle.zip"

[ -f "$BUNDLE_ZIP" ] || { echo "Error: $BUNDLE_ZIP not found. Run 'mise run artifactbundle $VERSION' first." >&2; exit 1; }
command -v gh >/dev/null || { echo "Error: GitHub CLI (gh) is not installed." >&2; exit 1; }

# The bundle carries macOS only, for the SwiftPM binaryTarget. Every platform
# also ships a plain archive, which is what mise can actually match on.
shopt -s nullglob
ARCHIVES=("sur-$VERSION-"*.tar.gz)
# Testing the first element rather than the array length, for the same
# templating reason as in the archives task.
[ -n "${ARCHIVES[0]:-}" ] || { echo "Error: no sur-$VERSION-*.tar.gz found. Run 'mise run archives $VERSION' first." >&2; exit 1; }
echo "Assets: $BUNDLE_ZIP ${ARCHIVES[*]}"

REPO=${GITHUB_REPOSITORY:-$(git remote get-url origin | sed -E 's#(git@|https://)github.com[:/]##; s#\.git$##')}

# SwiftPM's compute-checksum is the SHA-256 of the archive, so a plain hash
# works here and keeps this task free of a Swift toolchain.
if command -v shasum >/dev/null; then
  CHECKSUM=$(shasum -a 256 "$BUNDLE_ZIP" | cut -d' ' -f1)
else
  CHECKSUM=$(sha256sum "$BUNDLE_ZIP" | cut -d' ' -f1)
fi

# The asset URL is deterministic — tag name plus file name — so it can be
# written into Package.swift before the release exists.
ASSET_URL="https://github.com/$REPO/releases/download/$VERSION/$BUNDLE_ZIP"
echo "Asset URL: $ASSET_URL"
echo "Checksum:  $CHECKSUM"

edit() {
  sed -E "$2" "$1" > "$1.tmp"
  mv "$1.tmp" "$1"
}

# Only the binaryTarget URL (a GitHub *releases* URL) is rewritten, never the .package(url:) deps.
edit Package.swift "s|url: \"https://[^\"]*releases[^\"]*\"|url: \"$ASSET_URL\"|"
edit Package.swift "s/(checksum: \")[^\"]+(\")/\1$CHECKSUM\2/"

BRANCH=$(git rev-parse --abbrev-ref HEAD)
git add Package.swift Sources/SUR/SUR.swift
git commit -m "chore: release $VERSION"
git push origin "$BRANCH"

# gh tags this commit and uploads the artifact in one step.
gh release create "$VERSION" "$BUNDLE_ZIP" "${ARCHIVES[@]}" \
  --repo "$REPO" \
  --target "$(git rev-parse HEAD)" \
  --title "$VERSION" \
  --generate-notes

echo "Release $VERSION published."
'''

[tasks.release]
description = "Trigger the release workflow on CI"
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION=${1:?Usage: mise run release <version>}
command -v gh >/dev/null || { echo "Error: GitHub CLI (gh) is not installed." >&2; exit 1; }

gh workflow run release.yml --field version="$VERSION"
echo "Release workflow triggered for $VERSION. Follow it with: gh run watch"
'''
