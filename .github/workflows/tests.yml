name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    # The only GitHub-hosted image with Xcode 27. Its default Xcode is 27.1, so the
    # latest one is selected explicitly.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      # Modules built by another compiler version cannot be reused, so the Xcode
      # version is part of the key. Keep it in sync with DEVELOPER_DIR.
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode-27.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-27.2-

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests
        env:
          SKIP_SWIFTLINT: "1"

      - name: Run tests
        run: swift test --skip-build
        env:
          SKIP_SWIFTLINT: "1"

  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    # Same image as the Linux release build in release.yml.
    container: swift:6.4-jammy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests
        env:
          SKIP_SWIFTLINT: "1"

      - name: Run tests
        run: swift test --skip-build
        env:
          SKIP_SWIFTLINT: "1"

  lint:
    name: SwiftLint (strict)
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging Sources Tests Plugins
